## Why This Matters

In your interview, the model will likely be imperfect. The CTO is checking whether you can **manage model failure like an engineer**.

Your goal is not zero mistakes. Your goal is **fast detection + disciplined recovery + accurate narration**.

---

## Core Failure Classes (With Detection + Fix)

| Failure Class | Typical Symptom | Fast Detection | Recovery Move |
|---|---|---|---|
| Requirement collapse | Solves only part of task | Missing checklist item coverage | Force requirements restatement before implementation |
| Tool schema mismatch | Wrong args/fields in calls | Tool error payloads | Enforce strict schema echo + validation step |
| Context drift | Starts unrelated work | Mentions wrong files/goals | Hard reset prompt with current objective only |
| Shallow edits | Partial patch breaks references | Build/test/import breakage | Ask for symbol-impact map before patch |
| False completion | Says done without evidence | No test output/log evidence | Require proof block: checks run + outcomes |
| Over-editing | Touches unrelated files | Diff too broad | Minimal patch-only instruction |
| Looping retries | Repeats same failing action | Same error repeated 2+ times | Switch strategy; ask for 2 alternative fixes |
| Latency cliff | Slow, verbose, noisy responses | Response time spikes + token bloat | Narrow prompt + compact context |

---

## Inferior-Model Pattern Notes (Practical)

The exact behavior varies, but weak-model sessions commonly show:

1. Premature certainty.
2. Incomplete global refactors.
3. Weak error interpretation.
4. Poor long-context consistency.
5. Tool call brittleness under schema complexity.

### Mitigation defaults that usually help

1. Use strict output template.
2. Ask for assumptions first.
3. Limit patch scope to one objective.
4. Demand verification evidence.
5. Require explicit unresolved risks section.

---

## Hard Reset Protocol (Use Verbatim)

```text
Reset.
Objective: <single sentence>
Constraints:
1) <hard requirement>
2) <hard requirement>
3) Minimal diff only
4) No claims without verification

Output required:
- Assumptions
- Plan (<=6 bullets)
- Patch
- Checks run + results
- Risks/unknowns
```

---

## Verification Loop You Should Run Every Iteration

1. Small patch.
2. Smallest possible check.
3. If fail, ask model for root cause + 2 alternatives.
4. Pick one path and re-run.
5. Update progress summary with what changed and why.

### Red-line policy

If the same error repeats twice, stop and force a strategy change. Do not let the model spiral.

---

## Prompt Templates for Stability

### Template A - Requirement lock

```text
List all requirements in checklist form.
Map each requirement to one implementation step.
Do not write code until checklist is complete.
```

### Template B - Minimal patch mode

```text
Apply a minimal patch for only <target behavior>.
Do not modify formatting or unrelated code.
Return changed files and reasons.
```

### Template C - Verification-first

```text
Before final answer, provide:
1) checks executed
2) pass/fail result
3) unresolved risks
If checks were not run, state that explicitly.
```

---

## Micro-Eval Method for Interview Day

Create 5 mini prompts representing the challenge type and score each prompt version:

1. Requirement coverage.
2. Correctness.
3. Patch minimality.
4. Verification quality.
5. Latency.

Select the prompt style with the highest consistency, not the highest single-run output.

- https://developers.openai.com/api/docs/guides/evals
- https://developers.openai.com/api/docs/guides/evaluation-best-practices

## What Impresses CTOs Most Here

1. You catch failures quickly.
2. You do not hide uncertainty.
3. You tighten scope under pressure.
4. You produce auditable reasoning and proof.
