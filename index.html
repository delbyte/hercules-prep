## What This Is Optimizing For

Your interview is not about perfect code. It is about proving you can **operate an agentic build loop under constraints** with a weaker model.

Your visible senior signal:

1. Clarify objective and constraints fast.
2. Propose architecture with clean boundaries.
3. Spawn parallel work intentionally.
4. Validate aggressively.
5. Recover quickly when model/tooling breaks.
6. Explain tradeoffs clearly to CTO-level audience.

---

## 5-Hour Execution Plan (Expanded)

### Block 1 (00:00-00:30) - Lock your operating brief

Output:

- One 1-page "how I run this challenge" card.
- One acceptance checklist you can read out loud.

Checklist format:

1. Problem goal.
2. Constraints (time, model reliability, infra, scope).
3. MVP slice definition.
4. What not to build now.
5. Proof of done.

### Block 2 (00:30-01:45) - System design fundamentals only

Output:

- One architecture map: hosted on what + connects to what.
- One 2-minute verbal explanation script.

Primary reading page: [System Architecture Deep Dive](architecture.html)

### Block 3 (01:45-02:30) - Docker survival mode

Output:

- 10 command crib sheet.
- 30-second answer to "how would you containerize this now?"

Minimum command set to rehearse:

```bash
docker build -t app:local .
docker run -p 3000:3000 app:local
docker compose up -d
docker compose logs -f
docker compose down
```

### Block 4 (02:30-03:40) - Ralph loop + multi-agent execution

Output:

- Agent role split template (planner/explorer/implementer/verifier/synthesizer).
- Ralph loop execution script you can run in any IDE harness.

Primary reading page: [Ralph Loop + Skills + Multi-Agent Ops](skills-and-agents.html)

### Block 5 (03:40-04:35) - Weak-model mistakes and recovery

Output:

- Failure matrix with mitigation prompts.
- Reset protocol when output drifts.

Primary reading page: [Model Failure Playbook](model-failures.html)

### Block 6 (04:35-05:00) - Mock simulation and debrief

Output:

- 1 mock run result sheet: what failed, why, fix prompt.
- 1 final interview cheat sheet for tomorrow.

---

## Interview Narration Script (Use This Verbatim Style)

"I'll solve this in short loops. First I'll clarify requirements and define MVP boundaries. Then I'll map an architecture with explicit data flow and failure handling. I'll spawn parallel discovery for unknowns while implementing a minimal vertical slice. After each change, I'll run verification checks and log risks. If the model drifts, I reset context with strict output constraints."

---

## High-Value Drill Prompts

### Drill: unclear requirements

"Given this vague project request, generate 8 clarification questions grouped by product, technical constraints, and deployment assumptions."

### Drill: architecture under pressure

"Design the minimal production architecture for this webapp in 7 components. For each component include host, interface, failure mode, and fallback."

### Drill: weak model containment

"You are error-prone. First output assumptions, then plan (max 6 bullets), then minimal patch, then checks, then unresolved risks. Do not skip any section."
